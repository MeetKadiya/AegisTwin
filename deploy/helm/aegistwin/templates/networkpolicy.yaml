{{- if .Values.networkPolicy.enabled }}
# --- DEFAULT DENY ALL INGRESS & EGRESS ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegistwin.fullname" . }}-default-deny
  labels:
    {{- include "aegistwin.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# --- ALLOW CLUSTER DNS EGRESS ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegistwin.fullname" . }}-allow-dns
  labels:
    {{- include "aegistwin.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# --- BACKEND ZERO-TRUST POLICY ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegistwin.fullname" . }}-backend-netpol
  labels:
    {{- include "aegistwin.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegistwin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Frontend and Ingress controller
    - from:
        - podSelector:
            matchLabels:
              {{- include "aegistwin.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: frontend
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Egress to Neo4j
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegistwin.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: neo4j
      ports:
        - protocol: TCP
          port: 7687
        - protocol: TCP
          port: 7474
    # Egress to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegistwin.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Egress to NATS
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegistwin.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: nats
      ports:
        - protocol: TCP
          port: 4222
---
# --- FRONTEND ZERO-TRUST POLICY ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegistwin.fullname" . }}-frontend-netpol
  labels:
    {{- include "aegistwin.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegistwin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Ingress controller
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Egress to Backend
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegistwin.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8000
---
# --- DATA & BROKER STACK (NEO4J, POSTGRES, NATS) INGRESS ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegistwin.fullname" . }}-datastores-netpol
  labels:
    {{- include "aegistwin.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["neo4j", "postgres", "nats"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "aegistwin.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
        - podSelector:
            matchLabels:
              {{- include "aegistwin.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: edge-agent
      ports:
        - protocol: TCP
          port: 7687
        - protocol: TCP
          port: 7474
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4222
{{- end }}
