# --- BACKEND SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegistwin.fullname" . }}-backend
  labels:
    {{- include "aegistwin.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "aegistwin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
# --- FRONTEND SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegistwin.fullname" . }}-frontend
  labels:
    {{- include "aegistwin.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "aegistwin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
---
# --- EDGE AGENT SERVICE ---
{{- if .Values.edgeAgent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegistwin.fullname" . }}-edge-agent
  labels:
    {{- include "aegistwin.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge-agent
spec:
  type: {{ .Values.edgeAgent.service.type }}
  ports:
    - port: {{ .Values.edgeAgent.service.port }}
      targetPort: 9090
      protocol: TCP
      name: http-ingest
  selector:
    {{- include "aegistwin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: edge-agent
{{- end }}
---
# --- NEO4J SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegistwin.fullname" . }}-neo4j
  labels:
    {{- include "aegistwin.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.neo4j.service.boltPort }}
      targetPort: 7687
      protocol: TCP
      name: bolt
    - port: {{ .Values.neo4j.service.httpPort }}
      targetPort: 7474
      protocol: TCP
      name: http
  selector:
    {{- include "aegistwin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
---
# --- NATS SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegistwin.fullname" . }}-nats
  labels:
    {{- include "aegistwin.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.nats.service.clientPort }}
      targetPort: 4222
      protocol: TCP
      name: nats
    - port: {{ .Values.nats.service.monitorPort }}
      targetPort: 8222
      protocol: TCP
      name: monitor
  selector:
    {{- include "aegistwin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nats
---
# --- POSTGRESQL SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegistwin.fullname" . }}-postgres
  labels:
    {{- include "aegistwin.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    {{- include "aegistwin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
