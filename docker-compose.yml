services:
  # --- GRAPH DATABASE ---
  neo4j:
    image: neo4j:5.26.0-community
    container_name: aegistwin-neo4j
    environment:
      - NEO4J_AUTH=neo4j/aegistwin2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - aegis-net

  # --- RELATIONAL METADATA STORE ---
  postgres:
    image: postgres:17-alpine
    container_name: aegistwin-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aegis_twin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis_twin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aegis-net

  # --- ASYNC TASK BROKER ---
  redis:
    image: redis:7.4-alpine
    container_name: aegistwin-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - aegis-net

  # --- FASTAPI BACKEND ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegistwin-backend
    restart: on-failure
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=aegistwin2026
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aegis_twin
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegis-net

  # --- CELERY ASYNC WORKER ---
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegistwin-celery
    restart: on-failure
    command: celery -A main.celery_app worker --loglevel=info -c 2
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=aegistwin2026
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aegis_twin
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
    depends_on:
      - backend
      - redis
    networks:
      - aegis-net

  # --- NEXT.JS FRONTEND ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegistwin-frontend
    restart: on-failure
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aegis-net

volumes:
  neo4j_data:
  postgres_data:

networks:
  aegis-net:
    driver: bridge
