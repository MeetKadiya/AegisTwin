services:
  # --- GRAPH DATABASE ---
  neo4j:
    image: neo4j:5.26.0-community
    container_name: aegistwin-neo4j
    environment:
      - NEO4J_AUTH=neo4j/aegistwin2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - aegis-net

  # --- FASTAPI BACKEND ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegistwin-backend
    restart: on-failure
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=aegistwin2026
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - aegis-net

  # --- NEXT.JS FRONTEND ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:8000
    container_name: aegistwin-frontend
    restart: on-failure
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aegis-net

  # --- EVENT BROKER (NATS) ---
  nats:
    image: nats:2.10-alpine
    container_name: aegistwin-nats
    restart: on-failure
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222" # NATS protocol
      - "8222:8222" # NATS monitoring dashboard
    networks:
      - aegis-net

  # --- EDGE INGESTION AGENT ---
  edge-agent:
    build:
      context: ./edge-agent
      dockerfile: Dockerfile
    container_name: aegistwin-edge-agent
    restart: on-failure
    environment:
      - NATS_URL=nats://nats:4222
      - BUFFER_DB_PATH=/app/data/edge_buffer.db
      - TOPIC_PREFIX=aegistwin.telemetry
      - PORT=9090
    ports:
      - "9090:9090"
    volumes:
      - edge_buffer_data:/app/data
    depends_on:
      - nats
    networks:
      - aegis-net

volumes:
  neo4j_data:
  edge_buffer_data:

networks:
  aegis-net:
    driver: bridge
